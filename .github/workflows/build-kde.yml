name: Build and push webtop image (KDE)

on:
  push:
    branches:
      - main
    paths:
      - 'ubuntu-img/kde/**'
      - '!ubuntu-img/kde/README.md'
      - '!ubuntu-img/kde/LICENSE'
      - '!ubuntu-img/kde/docker-compose.yml'
      - '.github/workflows/build-kde.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/webtop

jobs:
  build:
    runs-on: ubuntu-latest
    # Only ubuntu-kde-osworld-<sha>: the plain ubuntu-kde-osworld tag is the image ForkRL's results were measured on,
    # pushed by hand; a rebuild pulls newer apt packages.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=ubuntu-kde-osworld-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ubuntu-img/kde
          file: ./ubuntu-img/kde/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kde
          cache-to: type=gha,mode=max,scope=kde
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ github.sha }}
